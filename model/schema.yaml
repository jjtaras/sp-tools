# What SP's assumptions file (sp-tools-config/assumptions.yaml) must contain.
# This file is generic: it names and types each assumption, never its value.
# lib/assumptions.mjs checks assumptions.yaml against it, and the build fails on any problem.
#
# Every entry under `assumptions:` in assumptions.yaml looks like:
#   some.key:
#     value: <the value>
#     since: 2026-10            # when it took effect (YYYY-MM or YYYY-MM-DD)
#     source: <why: owner decision, lookback result, measurement, ...>
#     replaces: <old value>     # optional; the value before this one
#     note: <anything else>     # optional
#
# Entries under `job_fixes:` are per-job corrections. They're plain values; explain each in its `note`.
#
# Types: number, share (number 0..1), string, regex (string that compiles), month (YYYY-MM),
# date (YYYY-MM-DD), list<string>, map<string>, map<number>, map<share>, map<any>.

version: 1

assumptions:
  # ---- cost model (both boards)
  cost.cogs_share:          { type: share,  used_by: [margin-board, production-tracker], description: "COGS + labor as a share of job value: the cost line, and the value rule's labor+materials share" }
  cost.overhead_share:      { type: share,  used_by: [margin-board], description: "Overhead as a share of job value. Margin = 1 - overhead - cost/value" }
  cost.margin_target:       { type: share,  used_by: [margin-board], description: "Target margin. Must equal 1 - overhead_share - cogs_share" }

  # ---- labor (both boards)
  labor.rate_drafting:      { type: number, unit: "$/hr", used_by: [margin-board, production-tracker], description: "Burdened rate for drafting hours" }
  labor.rate_other:         { type: number, unit: "$/hr", used_by: [margin-board, production-tracker], description: "Burdened rate for everyone else" }
  labor.overhead_items:     { type: list<string>, used_by: [margin-board, production-tracker], description: "Innergy labor items that are overhead, never job cost, even when booked to a job" }
  labor.drafting_department_prefix: { type: string, used_by: [margin-board, production-tracker], description: "Hours by people whose Innergy department starts with this are drafting" }
  labor.drafting_type_prefix:       { type: string, used_by: [margin-board, production-tracker], description: "Labor items whose Innergy Type starts with this are drafting" }
  labor.drafting_items:             { type: list<string>, used_by: [margin-board, production-tracker], description: "Other labor items that are drafting" }

  # ---- shop capacity and the shop-hours predictor (Production Tracker)
  shop.material_reserve_share:     { type: share,  used_by: [production-tracker], description: "Materials reserve; the value rule takes off the greater of this share or POs on the WO" }
  shop.crew_by_phase:              { type: map<number>, used_by: [production-tracker], description: "People in each shop area (cnc, fab, finishing). Total shop capacity is their sum; each area's capacity is its people x hours_per_week" }
  shop.hours_per_week:             { type: number, used_by: [production-tracker], description: "Hours per person per week; crew x this = weekly capacity" }
  shop.post_fab_fallback_share:    { type: share,  used_by: [production-tracker], description: "Past fabrication with no finishing/staging plan, remaining hours are capped at this share of the WO's budget" }
  shop.max_hours_per_wo_per_day:   { type: number, used_by: [production-tracker], description: "Work not yet in the shop is scheduled as late as possible at this rate per WO" }
  shop.load_weeks:                 { type: number, used_by: [production-tracker], description: "The tracker's one look-ahead, in weeks: schedule, load chart, bottleneck table and read-first notes" }
  shop.nonshop_pattern:            { type: regex,  used_by: [production-tracker], description: "Production WOs whose name matches are field/logistics value, not shop hours" }

  # ---- billing dashboard (Margin Board)
  billing.sheet_id:                { type: string, used_by: [margin-board], description: "Google Sheet ID of the SP Billing Dashboard" }
  billing.summary_tab:             { type: string, used_by: [margin-board], description: "Tab with the PROJECT / TOTAL VALUE table" }
  billing.co_gap_min:              { type: number, unit: "$", used_by: [margin-board], description: "Flag when billing and Innergy values differ by more than this (and 2%)" }
  billing.fully_billed_tolerance:  { type: number, unit: "$", used_by: [margin-board], description: "Nothing left to invoice when to-be-invoiced and ready-to-invoice are both within this" }

  # ---- margin board behavior
  board.recent_days:               { type: number, used_by: [margin-board], description: "'Still logging hours' window for fully billed jobs" }
  board.stale_after_hours:         { type: number, used_by: [margin-board], description: "Page warns when data is older than this" }
  innergy.timesheets_start:        { type: month,  used_by: [margin-board, production-tracker], description: "First month of timesheets in Innergy" }
  innergy.not_jobs:                { type: list<string>, used_by: [margin-board], description: "Innergy projects that aren't real jobs" }

  # ---- progress and outlook (Margin Board)
  progress.drafting_by_step:       { type: map<share>, used_by: [margin-board], description: "Share of a WO's drafting counted done, by workflow step; steps not listed = 1" }
  progress.shop_by_step:           { type: map<share>, used_by: [margin-board], description: "Share of a WO's shop work counted done, by workflow step; steps not listed = 0" }
  outlook.range_swing:             { type: share,  used_by: [margin-board], description: "Remaining shop work this much better or worse than its pace so far" }
  outlook.unordered_materials:     { type: share,  used_by: [margin-board], description: "Share of contract allowed for materials not yet ordered, before 80% shop progress" }
  outlook.min_shop_progress:       { type: share,  used_by: [margin-board], description: "Below this shop progress it's too early to project" }

  # ---- lookback (Margin Board)
  lookback.min_contract:           { type: number, unit: "$", used_by: [margin-board], description: "Closed jobs at or below this contract value are left out" }
  lookback.created_from:           { type: date,   used_by: [margin-board], description: "Closed jobs created before this are left out" }
  lookback.exclude:                { type: list<string>, used_by: [margin-board], description: "Closed jobs left out (e.g. done before POs were entered in Innergy)" }

  # ---- rule thresholds (shared by each board's code and its page)
  outlook.progress_weights:        { type: map<share>, used_by: [margin-board], description: "How much of a job drafting and the shop each count for in % done (drafting + shop = 1)" }
  outlook.unordered_until_shop_progress: { type: share, used_by: [margin-board], description: "Until this shop progress, the low end of the range allows for materials not yet ordered" }
  flags.burn_high:                 { type: share,  used_by: [margin-board], description: "High flag when budget used runs this far ahead of progress (share points)" }
  flags.burn_medium:               { type: share,  used_by: [margin-board], description: "Medium flag when budget used runs this far ahead of progress (share points)" }
  flags.cash_ahead:                { type: share,  used_by: [margin-board], description: "Medium flag when spent share runs this far ahead of invoiced share" }
  billing.co_gap_share:            { type: share,  used_by: [margin-board], description: "Billing vs Innergy value gap flagged when also over this share of the value" }
  receiving.min_po:                { type: number, unit: "$", used_by: [margin-board], description: "Receiving-error check only applies to PO lines at least this large" }
  receiving.error_ratio:           { type: number, used_by: [margin-board], description: "A line received at more than this multiple of its PO amount ..." }
  receiving.error_min_gap:         { type: number, unit: "$", used_by: [margin-board], description: "... and more than this many dollars off is a receiving error; the PO amount is used" }
  lookback.small_job_max:          { type: number, unit: "$", used_by: [margin-board], description: "Lookback 'small job' means contract under this" }
  schedule.at_risk_shop_days:      { type: number, used_by: [production-tracker], description: "At risk: this many shop days or fewer to staged and not yet in Fab" }
  schedule.watch_shop_days:        { type: number, used_by: [production-tracker], description: "Watch: this many shop days or fewer to staged and not yet in Fab" }
  schedule.due_soon_shop_days:     { type: number, used_by: [production-tracker], description: "'Due staged in the next N shop days' count" }
  shop.capacity_warn_share:        { type: share,  used_by: [production-tracker], description: "Weekly load is flagged at this share of capacity" }
  shop.phase_shares:               { type: map<number>, used_by: [production-tracker], description: "Share of a WO's labor hours by phase (drafting, cnc, fab, finishing), for the labor-burn bands" }
  fixes.zero_price_min_cost:       { type: number, unit: "$", used_by: [production-tracker], description: "Fix list: a $0-price WO is listed once its actual cost passes this" }

  # ---- shop-hours estimating (the production checklist rubric)
  estimating.fab_rates:            { type: map<number>, unit: "h per sq ft of elevation", used_by: [estimating], description: "Fabrication hours per sq ft of elevation, by build type" }
  estimating.showpiece_multiplier: { type: number, used_by: [estimating], description: "Showpiece work (glass/muntins, wine rack, milled trim) = this × the cased rate" }
  estimating.cnc_formula:          { type: map<number>, used_by: [estimating], description: "CNC hours = base + per_part × deduplicated part count" }
  estimating.finish_primer_rate:   { type: number, unit: "h per sq ft of primed area", used_by: [estimating], description: "Primer-only finishing hours per sq ft of primed area (measured by finish scope)" }

job_fixes:
  billing_match:          { type: "map<string>", used_by: [margin-board], description: "Billing project name → Innergy project number, when the automatic match is wrong" }
  job_notes:              { type: "map<string>", used_by: [margin-board], description: "Innergy project number → note shown on the board" }
  exclude_jobs:           { type: "map<string>", used_by: [production-tracker], description: "Job number → reason; left off the tracker" }
  hold_jobs:              { type: "list<string>", used_by: [production-tracker], description: "Job numbers shown as on hold, out of counts and load" }
  value_overrides:        { type: "map<any>", used_by: [production-tracker], description: "Job → WO suffix → value to use when the Innergy price is $0 or wrong" }
  install_included_jobs:  { type: "map<share>", used_by: [production-tracker], description: "Job → share of each WO's value that is installation (removed before the value rule)" }
  critical_placeholders:  { type: "map<any>", used_by: [production-tracker], description: "Job → {from, to, note}: WOs dated 'from' are treated as due 'to'" }
  outsourced:             { type: "map<any>", used_by: [production-tracker], description: "Job → WO suffix → {scope, shop_hrs}: made outside" }
  extra_jobs:             { type: "map<string>", used_by: [production-tracker], description: "Innergy project number → label, for jobs with no job number in their name yet" }
